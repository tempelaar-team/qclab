name: Tests

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'docs/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'docs/**'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: one Python version, Linux only.
  # Runs on every push and every PR.
  fast:
    name: Fast tests (py3.11, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[tests]
      - name: Run tests
        run: pytest -m "not mpi" tests

  # Full matrix: only runs on PRs into main/dev, and on pushes to main.
  # Pushes to feature branches and to dev itself skip this.
  full:
    name: Full matrix — py${{ matrix.python-version }}
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[tests]
      - name: Run tests
        run: pytest -m "not mpi" tests