name: Install matrix (Windows/macOS/Linux) PyPI

# Triggered after a release is published. Use workflow_dispatch to re-run
# manually after PyPI's index has caught up if the post-release run failed.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: install-pypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-from-pypi:
    name: Install from PyPI — ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Wait for PyPI to propagate
        shell: bash
        run: sleep 60
      - name: Install published package
        run: |
          python -m pip install -U pip
          python -m pip install qclab
      - name: Smoke import
        run: |
          python -c "import qclab as m; print('qclab (PyPI) version:', getattr(m,'__version__','unknown'))"