name: Pylint

on:
  pull_request:
    branches: [main, dev]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/pylint.yml'

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pylint:
    name: Pylint (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install .   # so pylint can resolve imports
      - name: Run pylint
        # Currently informational. Remove `|| true` to make this enforcing.
        run: pylint $(git ls-files '*.py') || true