name: Install matrix (Windows/macOS/Linux) Source

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'docs/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: install-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-from-source:
    name: Build & install (source) — ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build wheel & sdist
        run: |
          python -m pip install -U pip build twine
          python -m build -w -s -o dist
      - name: Validate metadata (twine check)
        shell: bash
        run: python -m twine check dist/*
      - name: Install the built wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke import
        run: |
          python -c "import qclab as m; print('qclab version:', getattr(m,'__version__','unknown'))"